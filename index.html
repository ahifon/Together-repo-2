<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A2A1F" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mariage" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Invitation de mariage de Seynan et Ezechiel — programme, plan de table et informations pratiques." />
    <title>Seynan & Ezechiel | Mariage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Great+Vibes&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; scrollbar-width: none; }
      *::-webkit-scrollbar { display: none; }
      :root { --nav-h: 76px; }
      html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
      html, body { margin: 0; padding: 0; background: #0A2A1F; width: 100%; height: 100%; }
      body { overscroll-behavior: none; -webkit-font-smoothing: antialiased; touch-action: manipulation; }
      #root { width: 100%; min-height: 100vh; min-height: 100dvh; }
      button, a { touch-action: manipulation; -webkit-touch-callout: none; }
      input { font-size: 16px; }

      .app-root {
        min-height: 100vh; min-height: 100dvh; width: 100%;
        display: flex; align-items: stretch; justify-content: center;
        background: linear-gradient(180deg, #0d3a2d 0%, #123f30 34%, #0b2e23 100%);
      }
      .app-shell {
        width: 100%; max-width: 430px;
        height: 100vh; height: 100dvh;
        position: relative; overflow: hidden; margin: 0 auto;
        box-shadow: 0 0 0 1px rgba(201,164,92,0.45), 0 12px 30px rgba(0,0,0,0.24);
      }
      .app-scroll {
        position: absolute; top: 0; left: 0; right: 0;
        bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px));
        padding-top: env(safe-area-inset-top, 0px);
        overflow-y: auto; overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
      }
      /* Phone: full-bleed native-app feel */
      @media (max-width: 480px) {
        .app-shell { max-width: none; box-shadow: none; }
      }
      /* Desktop / tablet: phone frame, vertically centered */
      @media (min-width: 481px) and (min-height: 760px) {
        .app-root { align-items: center; padding: 24px 0; }
        .app-shell { height: min(900px, calc(100dvh - 48px)); border-radius: 28px; }
      }
      /* Small / landscape phones */
      @media (max-height: 520px) {
        :root { --nav-h: 56px; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
      }
      a { color: #E4C98A; }
      a:hover { color: #F6EFE2; }
      button, input { font-family: inherit; }
      input::placeholder { color: rgba(246,239,226,.6); }
      @keyframes twinkle {
        0%, 100% { opacity: 0; transform: scale(.4); }
        50% { opacity: 1; transform: scale(1); }
      }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: none; }
      }
      @keyframes sheetUp {
        from { transform: translateY(100%); }
        to { transform: none; }
      }
      @keyframes halo {
        0%, 100% { box-shadow: 0 0 0 1px #C9A45C, 0 0 18px rgba(228,201,138,.25); }
        50% { box-shadow: 0 0 0 1px #E4C98A, 0 0 32px rgba(228,201,138,.5); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

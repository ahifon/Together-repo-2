<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A2A1F" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mariage" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Invitation de mariage de Seynan et Ezechiel — programme, plan de table et informations pratiques." />
    <title>Seynan & Ezechiel | Mariage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Great+Vibes&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; scrollbar-width: none; }
      *::-webkit-scrollbar { display: none; }
      :root { --nav-h: 76px; }
      html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
      html, body { margin: 0; padding: 0; background: #0A2A1F; width: 100%; height: 100%; }
      body { overscroll-behavior: none; -webkit-font-smoothing: antialiased; touch-action: manipulation; }
      #root { width: 100%; min-height: 100vh; min-height: 100dvh; }
      button, a { touch-action: manipulation; -webkit-touch-callout: none; }
      input { font-size: 16px; }

      .app-root {
        min-height: 100vh; min-height: 100dvh; width: 100%;
        display: flex; align-items: stretch; justify-content: center;
        background: linear-gradient(180deg, #0d3a2d 0%, #123f30 34%, #0b2e23 100%);
      }
      .app-shell {
        width: 100%; max-width: 430px;
        height: 100vh; height: 100dvh;
        position: relative; overflow: hidden; margin: 0 auto;
        box-shadow: 0 0 0 1px rgba(201,164,92,0.45), 0 12px 30px rgba(0,0,0,0.24);
      }
      .app-scroll {
        position: absolute; top: 0; left: 0; right: 0;
        bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px));
        padding-top: env(safe-area-inset-top, 0px);
        overflow-y: auto; overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
      }
      /* Phone: full-bleed native-app feel */
      @media (max-width: 480px) {
        .app-shell { max-width: none; box-shadow: none; }
      }
      /* Desktop / tablet: phone frame, vertically centered */
      @media (min-width: 481px) and (min-height: 760px) {
        .app-root { align-items: center; padding: 24px 0; }
        .app-shell { height: min(900px, calc(100dvh - 48px)); border-radius: 28px; }
      }
      /* Desktop: editorial split — photo on the left, phone on the right */
      .desk-aside { display: none; }
      .app-stage { display: contents; }
      @media (min-width: 1000px) {
        .app-root {
          display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr);
          align-items: stretch; padding: 0; gap: 0; overflow: hidden;
          background:
            radial-gradient(ellipse 60% 55% at 78% 50%, rgba(201,164,92,.16), transparent 70%),
            linear-gradient(135deg, #0b2e23 0%, #0d3a2d 55%, #07201a 100%);
        }
        .app-stage {
          display: flex; align-items: center; justify-content: center;
          padding: 48px 40px; position: relative;
        }
        .app-stage::before {
          content: ''; position: absolute; left: 50%; top: 50%; width: 520px; height: 520px;
          transform: translate(-50%, -50%); border-radius: 50%;
          border: 1px solid rgba(201,164,92,.18);
          box-shadow: 0 0 0 40px rgba(201,164,92,.04), 0 0 0 41px rgba(201,164,92,.1);
        }
        .app-shell {
          height: min(860px, calc(100dvh - 96px)); border-radius: 46px;
          box-shadow:
            0 0 0 9px #07150f,
            0 0 0 10px rgba(228,201,138,.7),
            0 50px 100px rgba(0,0,0,.6),
            0 0 90px rgba(201,164,92,.18);
        }

        .desk-aside {
          display: block; position: relative; overflow: hidden; min-height: 100dvh;
          color: #F6EFE2;
        }
        .desk-photo {
          position: absolute; inset: 28px 0 28px 28px;
          background: url(couple-desktop.jpg) center top / contain no-repeat;
          -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 9%, #000 91%, transparent 100%);
          mask-image: linear-gradient(90deg, transparent 0, #000 9%, #000 91%, transparent 100%);
          animation: fadeUp .9s ease both;
        }
        .desk-aside::before {
          content: ''; position: absolute; inset: 0; z-index: 1;
          background:
            linear-gradient(0deg, rgba(5,22,17,.96) 0%, rgba(5,22,17,.72) 34%, rgba(5,22,17,.1) 66%, rgba(5,22,17,.25) 100%),
            linear-gradient(90deg, rgba(6,36,27,.28), rgba(6,36,27,0) 60%);
        }
        .desk-aside::after {
          content: ''; position: absolute; z-index: 2; inset: 28px 0 28px 28px;
          border: 1px solid rgba(228,201,138,.35); border-right: 0;
          pointer-events: none;
        }
        .desk-content {
          position: absolute; z-index: 3; left: 0; right: 0; bottom: 0;
          padding: 0 72px 76px 76px;
          display: flex; flex-direction: column; align-items: flex-start; text-align: left;
          animation: fadeUp .8s ease .15s both;
        }
        .desk-kicker { font-family: Cinzel, serif; font-size: 13px; letter-spacing: .5em; text-transform: uppercase; color: #E4C98A; }
        .desk-names {
          margin-top: 10px; font-family: 'Great Vibes', cursive;
          font-size: clamp(64px, 7.2vw, 118px); line-height: 1.02; color: #F8E3B4;
          text-shadow: 0 4px 40px rgba(0,0,0,.45), 0 0 30px rgba(228,201,138,.2);
        }
        .desk-names span { color: #C9A45C; font-size: .62em; margin: 0 .08em; }
        .desk-ornament { display: flex; align-items: center; gap: 16px; width: 260px; margin: 22px 0 18px; color: #C9A45C; }
        .desk-ornament i { flex: 1; height: 1px; background: linear-gradient(90deg, #C9A45C, transparent); }
        .desk-ornament i:first-child { display: none; }
        .desk-ornament b { font-size: 13px; font-weight: 400; }
        .desk-date { font-family: Cinzel, serif; font-size: 15px; letter-spacing: .28em; text-transform: uppercase; color: #F6EFE2; }
        .desk-note { margin: 24px 0 0; max-width: 460px; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 21px; font-style: italic; line-height: 1.55; color: rgba(246,239,226,.82); }
      }
      /* Small / landscape phones */
      @media (max-height: 520px) {
        :root { --nav-h: 56px; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
      }
      a { color: #E4C98A; }
      a:hover { color: #F6EFE2; }
      button, input { font-family: inherit; }
      input::placeholder { color: rgba(246,239,226,.6); }
      @keyframes twinkle {
        0%, 100% { opacity: 0; transform: scale(.4); }
        50% { opacity: 1; transform: scale(1); }
      }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: none; }
      }
      @keyframes sheetUp {
        from { transform: translateY(100%); }
        to { transform: none; }
      }
      @keyframes halo {
        0%, 100% { box-shadow: 0 0 0 1px #C9A45C, 0 0 18px rgba(228,201,138,.25); }
        50% { box-shadow: 0 0 0 1px #E4C98A, 0 0 32px rgba(228,201,138,.5); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
